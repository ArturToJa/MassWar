; These two processors are the ones that actually compute visualization LOD and switch entities between
; ISM/actor/none representation. Both ship with bAutoRegisterWithProcessingPhases=false in C++ (they are
; "dynamic" processors by design) and normally get enabled by a developer ticking a checkbox in
; Project Settings > Mass > Mass Entity > Processor CDOs. Since this project's Mass config was authored
; headlessly, that step never happened, which is why entities' FMassRepresentationLODFragment stayed
; stuck at its EMassLOD::Max sentinel forever and CurrentRepresentation never left None - Mass itself
; never logs an error for this, unlike the (correctly-registered) LOD collector processors.
; ExecutionFlags is a plain uint8 bitmask (Standalone=1, Server=2, Client=4 - see
; EProcessorExecutionFlags in MassProcessingTypes.h). Neither processor's C++ constructor sets it, and
; the base UMassProcessor declaration has no default member initializer either, so its effective value
; was whatever the CDO happened to carry - pin it explicitly to all net modes (7) so representation/LOD
; computes identically on a listen server, a client, and standalone, instead of depending on an implicit
; default that (per Pass 5 testing) left a real client with entities that never left EMassLOD::Max.
[/Script/MassRepresentation.MassVisualizationLODProcessor]
bAutoRegisterWithProcessingPhases=True
ExecutionFlags=7

[/Script/MassRepresentation.MassVisualizationProcessor]
bAutoRegisterWithProcessingPhases=True
ExecutionFlags=7
